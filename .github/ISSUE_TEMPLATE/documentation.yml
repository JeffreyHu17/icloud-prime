name: Documentation
description: Report missing, confusing, or incorrect docs.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README.md, API.md, Windows portable setup
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or wrong?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested improvement
